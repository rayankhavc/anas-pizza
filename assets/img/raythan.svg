<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Raythan Web Design">
  <title>Raythan Web Design</title>
  <!-- La couleur est écrite en dur : le fichier est chargé par <img>,
       où currentColor ne vaut rien et retomberait sur du noir.
       Marque de l'agence, posée dans le pied de page du site du client.
       Un monogramme et rien d'autre : elle s'affiche à 28 px, et tout ce
       qu'on ajouterait à cette taille ferait une tache. Elle prend la
       couleur du texte de crédit, jamais celle de la marque du restaurant —
       la signature d'un prestataire ne parle pas plus fort que la maison. -->
